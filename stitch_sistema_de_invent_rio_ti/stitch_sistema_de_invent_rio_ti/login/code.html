<div class="bg-surface-container-lowest shadow-xl rounded-xl p-space-xl flex flex-col gap-space-lg relative overflow-hidden">
<div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-primary via-secondary to-primary-container"></div>



<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-md" id="section-ldap">
<div class="flex flex-col gap-1.5"><label class="font-label-md text-label-md text-on-surface" for="username">Usuário / Matrícula</label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3 text-outline text-headline-sm select-none">person</span><input class="w-full h-11 pl-10 pr-3 bg-surface-container-low rounded font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-lowest transition-colors" id="username" placeholder="ex: usuario.sobrenome ou matrícula" type="text" autocomplete="username" required=""></div></div>
<div class="flex flex-col gap-1.5"><div class="flex justify-between items-center"><label class="font-label-md text-label-md text-on-surface" for="password">Senha</label></div><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3 text-outline text-headline-sm select-none">lock</span><input class="w-full h-11 pl-10 pr-10 bg-surface-container-low rounded font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:bg-surface-container-lowest transition-colors" id="password" placeholder="••••••••••••" type="password" autocomplete="current-password" required=""><button class="absolute right-3 text-outline hover:text-on-surface" onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';" type="button"><span class="material-symbols-outlined text-headline-sm">visibility</span></button></div></div>
</div>


<div class="flex flex-col gap-space-sm pt-space-xs"><button class="w-full h-11 bg-primary text-on-primary hover:bg-primary-container rounded font-headline-sm text-headline-sm flex items-center justify-center gap-2 shadow transition-all active:scale-[0.99]" type="submit"><span class="material-symbols-outlined text-headline-sm">login</span><span class="">Acessar Sistema</span></button></div>
</form>

</div>
<div class="flex items-center justify-center gap-4 py-space-md text-on-surface-variant font-code-sm text-code-sm">
<span class="">SIGPAT-TI v4.12.0</span>
<span class="">•</span>
<span class="">SLA 99.98%</span>
<span class="">•</span>
<span class="">Zona Segura DMZ-01</span>
</div>
<script>
    const tabLdap = document.getElementById('tab-ldap');
    const tabGovbr = document.getElementById('tab-govbr');
    const secLdap = document.getElementById('section-ldap');
    const secGovbr = document.getElementById('section-govbr');

    tabLdap.addEventListener('click', () => {
      tabLdap.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
      tabLdap.classList.remove('text-on-surface-variant');
      tabGovbr.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
      tabGovbr.classList.add('text-on-surface-variant');
      secLdap.classList.remove('hidden');
      secGovbr.classList.add('hidden');
    });

    tabGovbr.addEventListener('click', () => {
      tabGovbr.classList.add('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
      tabGovbr.classList.remove('text-on-surface-variant');
      tabLdap.classList.remove('bg-surface-container-lowest', 'text-on-surface', 'shadow-sm');
      tabLdap.classList.add('text-on-surface-variant');
      secGovbr.classList.remove('hidden');
      secGovbr.classList.add('flex');
      secLdap.classList.add('hidden');
    });

    const mfaInputs = document.querySelectorAll('.mfa-digit');
    mfaInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && idx < mfaInputs.length - 1) {
          mfaInputs[idx + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          mfaInputs[idx - 1].focus();
        }
      });
    });
  </script>
